<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai Nydhana | Vision Path</title>
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: sans-serif; background: #000; color: #fff; }
        
        /* LOGO */
        .logo {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 70px;
            z-index: 1000;
            border-radius: 50%;
        }

        header {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #111; /* Fallback color */
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
        }

        section { padding: 60px 20px; max-width: 900px; margin: auto; }
        
        .feature-img {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            margin-top: 20px;
        }

        video { width: 100%; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Logo with simple filename -->
    <img src="logo.jpg" alt="Vision Path Logo" class="logo">

    <header>
        <div class="overlay">
            <h1>SAI NYDHANA</h1>
            <p>VISION PATH — Smart Navigation for the Visually Impaired</p>
            <a href="#project" class="btn">Explore Device</a>
        </div>
    </header>

    <section id="project">
        <h2>The Vision</h2>
        <p>Vision Path is a portable ultrasonic obstacle detection device designed for safety and mobility.</p>
        
        <!-- Image with simple filename -->
        <img src="obstacle.jpg" alt="Obstacle Detection in Action" class="feature-img">
    </section>

    <section>
        <h2>Project Showcase</h2>
        <!-- Video with simple filename -->
        <video controls>
            <source src="demo.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

</body>
</html>
